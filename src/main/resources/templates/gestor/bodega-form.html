<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/base :: pagina('Artículo de bodega', ~{::section})}"><body><section>
<link rel="stylesheet" th:href="@{/css/plantas.css}">
<nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Plantas y bodega"><a class="btn btn-outline-success" th:href="@{/gestor/plantas}">Mis plantas</a><a class="btn btn-outline-success" th:href="@{/gestor/plantas/catalogo}">Catálogo común</a><a class="btn btn-outline-success" th:href="@{/gestor/bodega}">Bodega</a></nav><h1 class="h2">Artículo de bodega</h1><form class="plantas-panel" th:action="@{${accion}}" th:object="${form}" method="post" novalidate><div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><ul class="mb-0"><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="mb-3"><label for="nombre" class="form-label">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" maxlength="120" required></div><div class="mb-3"><label for="categoria" class="form-label">Categoría</label><select id="categoria" class="form-select" th:field="*{categoria}" required><option value="">Selecciona una categoría</option><option th:each="c : ${categorias}" th:value="${c}" th:text="${c.etiqueta()}"></option></select></div><div class="mb-3"><label for="cantidad" class="form-label">Cantidad actual (unidades)</label><input id="cantidad" class="form-control" type="number" th:field="*{cantidad}" min="0" max="100000" required></div><button class="btn btn-huerto" type="submit">Guardar artículo</button><a class="btn btn-link" th:href="@{/gestor/bodega}">Cancelar</a></form>
</section></body></html>
