<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/base :: pagina(titulo='Mi siembra', contenido=~{::section}, avisosPlantas=true)}"><body><section>
<link rel="stylesheet" th:href="@{/css/plantas.css}">
<nav th:replace="~{fragmentos/plantas :: pestanas('mis-plantas')}"></nav>
<h1 class="h2" th:text="${planta.nombreComun}"></h1><p class="text-muted">Cantidad y siembra de tu comunidad. La ficha botánica se administra en el catálogo común.</p><form class="plantas-panel" th:action="@{/gestor/plantas/{id}/siembra(id=${planta.id})}" th:object="${form}" method="post" novalidate><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert"><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><label for="cantidad" class="form-label">Cantidad en el huerto real</label><input id="cantidad" class="form-control mb-3" th:field="*{cantidad}" type="number" min="0" max="100000" required><div class="form-check form-switch"><input type="checkbox" id="plantada" class="form-check-input" th:field="*{plantada}"><label for="plantada" class="form-check-label fw-semibold">Ya está plantada</label></div><p class="form-text">Este estado es independiente de «activa», de la cantidad y de las existencias de bodega.</p><button type="submit" class="btn btn-huerto">Guardar mi siembra</button><a class="btn btn-link" th:href="@{/gestor/plantas}">Cancelar</a></form>
</section></body></html>
