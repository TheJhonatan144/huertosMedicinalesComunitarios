spring:
  application:
    name: huertos-medicinales
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/huertos}
    username: ${DB_USUARIO:huertos}
    password: ${DB_CLAVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # Margen sobre el límite de la aplicación para que el rechazo lo haga el validador propio (mensaje claro).
      max-file-size: 8MB
      max-request-size: 9MB
  thymeleaf:
    cache: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# --- Parámetros del dominio (PROVISIONALES salvo indicación; ver docs/pendientes.md) ---
app:
  almacenamiento:
    directorio: ${EVIDENCIAS_DIR:./datos/evidencias}
    # Límites provisionales pendientes de aprobación del equipo.
    tamano-maximo-bytes: 5242880        # 5 MiB
    lado-maximo-px: 8000
    pixeles-maximos: 25000000           # 25 MP
  comunidades:
    cupo-maximo: 25                     # regla aprobada: máximo 25 integrantes activos, incluido el gestor
  gamificacion:
    # VALORES DE DEMOSTRACIÓN: RB06 no está aprobada.
    puntos-individuales-por-actividad: 10
    puntos-comunitarios-por-actividad: 20
    progreso-por-actividad: 5
    umbral-oficial: 50
    umbral-maestro: 150
    meta-progreso-huerto: 100
    etapas:
      - { nombre: Semilla, desde: 0 }
      - { nombre: Brote, desde: 10 }
      - { nombre: Planta joven, desde: 30 }
      - { nombre: Huerto floreciente, desde: 60 }
  demo:
    habilitado: false
