<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina('Iniciar sesión', ~{::section})}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h1 class="h3 mb-3">Iniciar sesión</h1>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">Usuario o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-info" role="status">Cerraste la sesión.</div>
            <form th:action="@{/login}" method="post" data-una-vez>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button class="btn btn-huerto w-100" type="submit">Entrar</button>
            </form>
            <p class="small text-muted mt-3">
                Las cuentas son provistas por el equipo del proyecto (no hay registro público ni recuperación por correo).
                En el perfil de demostración encontrarás las cuentas en el README.
            </p>
        </div>
    </div>
</section>
</body>
</html>
